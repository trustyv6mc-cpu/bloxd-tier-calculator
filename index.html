<!DOCTYPE html>
<html>
<head>
  <title>Tier Tester Pro Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 420px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 0 25px rgba(0,255,150,0.15);
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    h1 {
      text-align: center;
      color: #00ff88;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      height: 160px;
      background: #111;
      color: white;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 10px;
      resize: none;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #00ff88, #00c3ff);
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: rgba(0,0,0,0.4);
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tier {
      font-size: 22px;
      font-weight: bold;
    }

    .LT5 { color: #ff4d4d; }
    .HT5 { color: #ff884d; }
    .LT4 { color: #ffd24d; }
    .HT4 { color: #c6ff4d; }
    .LT3 { color: #4dff88; }
    .HT3 { color: #00ff88; }
    .LT2 { color: #00e6ff; }
    .HT2 { color: #4d79ff; }
    .LT1 { color: #b84dff; }
    .HT1 { color: #ff4df0; }

    .small {
      font-size: 13px;
      opacity: 0.8;
    }

    .good {
      margin-top: 10px;
      color: #00ff88;
      font-weight: bold;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>⚔️ Tier Tester Pro</h1>

  <textarea id="input">Tier tester tier: LT2
W 67
W 12
W 13
W 15
W 14</textarea>

  <button onclick="calc()">RUN ANALYSIS</button>

  <div id="result"></div>

</div>

<script>
function calc() {
    let lines = document.getElementById("input").value.trim().split("\n");

    let testerTier = lines[0].split(":")[1].trim().toUpperCase();

    let sum = 0;
    let count = 0;

    for (let i = 1; i < lines.length; i++) {
        let parts = lines[i].split(" ");
        let type = parts[0];
        let value = parseFloat(parts[1]);

        if (isNaN(value)) continue;

        if (type === "W") sum += value;
        else if (type === "L") sum -= value;

        count++;
    }

    let avg = sum / count;
    let value = avg / 100;

    let tier = "";
    let range = "";
    let colorClass = "";

    if (value < 0.2) { tier="LT5"; range="0.1 - 0.19999"; colorClass="LT5"; }
    else if (value < 0.3) { tier="HT5"; range="0.2 - 0.29999"; colorClass="HT5"; }
    else if (value < 0.4) { tier="LT4"; range="0.3 - 0.39999"; colorClass="LT4"; }
    else if (value < 0.5) { tier="HT4"; range="0.4 - 0.49999"; colorClass="HT4"; }
    else if (value < 0.6) { tier="LT3"; range="0.5 - 0.59999"; colorClass="LT3"; }
    else if (value < 0.7) { tier="HT3"; range="0.6 - 0.69999"; colorClass="HT3"; }
    else if (value < 0.8) { tier="LT2"; range="0.7 - 0.79999"; colorClass="LT2"; }
    else if (value < 0.9) { tier="HT2"; range="0.8 - 0.89999"; colorClass="HT2"; }
    else if (value < 1.0) { tier="LT1"; range="0.9 - 0.99999"; colorClass="LT1"; }
    else { tier="HT1"; range="1.0+"; colorClass="HT1"; }

    document.getElementById("result").innerHTML =
    `<div class="result">
        <div>📊 Average: <b>${avg.toFixed(2)}</b></div>
        <div>⚡ Value: <b>${value.toFixed(3)}</b></div>

        <div class="tier ${colorClass}">🏆 Player Tier: ${tier}</div>

        <div class="small">📌 Range: ${range}</div>
        <div class="small">👤 Tester Tier: ${testerTier}</div>

        <div class="good">🎉 Analysis Complete!</div>
    </div>`;
}
</script>

</body>
</html>
