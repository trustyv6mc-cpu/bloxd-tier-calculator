<!DOCTYPE html>
<html>
<head>
  <title>Bloxd Tier Calculator</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg,#020617,#0f172a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 500px;
      padding: 25px;
      border-radius: 20px;
      background: rgba(255,255,255,0.05);
      box-shadow: 0 0 40px rgba(128,0,255,0.2);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
    }

    label {
      margin-top: 15px;
      display: block;
      font-size: 14px;
      color: #cbd5f5;
    }

    select, input {
      width: 100%;
      margin-top: 5px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #020617;
      color: white;
      outline: none;
    }

    select:focus, input:focus {
      border-color: #a855f7;
      box-shadow: 0 0 10px #a855f7;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      background: linear-gradient(90deg,#a855f7,#ec4899);
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.03);
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 15px;
      background: rgba(168,85,247,0.1);
      text-align: center;
    }

    .tier {
      font-size: 22px;
      font-weight: bold;
      color: #c084fc;
    }
  </style>
</head>

<body>

<div class="container">

<h1>Tier Calculator</h1>
<p>Positive = Win • Negative = Loss</p>

<label>Tier Tester Tier</label>
<select id="tier">
  <option>HT1</option>
  <option>LT1</option>
  <option>HT2</option>
  <option>LT2</option>
  <option>HT3</option>
  <option>LT3</option>
  <option>HT4</option>
  <option>LT4</option>
  <option>HT5</option>
  <option>LT5</option>
</select>

<label>HP List</label>
<input id="hp" placeholder="Example: 37, -9, 67, 81">

<button onclick="calc()">Calculate Tier</button>

<div id="result" class="result">Result will appear here</div>

</div>

<script>

// Tier values
const tierMap = {
  LT5: 0.1, HT5: 0.2,
  LT4: 0.3, HT4: 0.4,
  LT3: 0.5, HT3: 0.6,
  LT2: 0.7, HT2: 0.8,
  LT1: 0.9, HT1: 1.0
};

function calc() {

  let tierName = document.getElementById("tier").value;
  let t = tierMap[tierName];

  let input = document.getElementById("hp").value;
  let nums = input.split(",").map(x => parseFloat(x.trim())).filter(x => !isNaN(x));

  if (nums.length === 0) {
    document.getElementById("result").innerHTML = "❌ Invalid input";
    return;
  }

  let sum = 0;
  for (let n of nums) sum += n;

  let avg = sum / nums.length;

  // 🔥 YOUR REAL FORMULA
  let value = (avg / 100) * (t - 1) + t;

  let tier = "";

  if (value < 0.2) tier="LT5";
  else if (value < 0.3) tier="HT5";
  else if (value < 0.4) tier="LT4";
  else if (value < 0.5) tier="HT4";
  else if (value < 0.6) tier="LT3";
  else if (value < 0.7) tier="HT3";
  else if (value < 0.8) tier="LT2";
  else if (value < 0.9) tier="HT2";
  else if (value < 1.0) tier="LT1";
  else tier="HT1";

  document.getElementById("result").innerHTML = `
    Average HP: ${avg.toFixed(2)} <br><br>
    Value: ${value.toFixed(3)} <br><br>
    <span class="tier">${tier}</span>
  `;
}

</script>

</body>
</html>
