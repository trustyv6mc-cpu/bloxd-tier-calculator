<!DOCTYPE html>
<html>
<head>
  <title>Bloxd Tier Calculator</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg,#020617,#0f172a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 500px;
      padding: 25px;
      border-radius: 20px;
      background: rgba(255,255,255,0.05);
      box-shadow: 0 0 40px rgba(168,85,247,0.2);
    }

    h1 {
      text-align: center;
    }

    label {
      margin-top: 15px;
      display: block;
      font-size: 14px;
      color: #cbd5f5;
    }

    select, input {
      width: 100%;
      margin-top: 5px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #020617;
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      background: linear-gradient(90deg,#a855f7,#ec4899);
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 15px;
      background: rgba(168,85,247,0.1);
      text-align: center;
      line-height: 1.8;
    }

    .tier {
      font-size: 22px;
      font-weight: bold;
      color: #c084fc;
    }
  </style>
</head>

<body>

<div class="container">

<h1>⚔️ Bloxd Tier Calculator</h1>

<label>Tier Tester Tier</label>
<select id="tier">
  <option>HT1</option>
  <option>LT1</option>
  <option>HT2</option>
  <option>LT2</option>
  <option>HT3</option>
  <option>LT3</option>
  <option>HT4</option>
  <option>LT4</option>
  <option>HT5</option>
  <option>LT5</option>
</select>

<label>HP List (comma separated)</label>
<input id="hp" placeholder="Example: 37, -9, 67, -20">

<button onclick="calc()">Calculate</button>

<div id="result" class="result">Result will appear here</div>

</div>

<script>

// EXACT tier values
const tierMap = {
  LT5: 0.1, HT5: 0.2,
  LT4: 0.3, HT4: 0.4,
  LT3: 0.5, HT3: 0.6,
  LT2: 0.7, HT2: 0.8,
  LT1: 0.9, HT1: 1.0
};

function getTierFromValue(v) {
  if (v >= 0.1 && v < 0.2) return "LT5";
  if (v >= 0.2 && v < 0.3) return "HT5";
  if (v >= 0.3 && v < 0.4) return "LT4";
  if (v >= 0.4 && v < 0.5) return "HT4";
  if (v >= 0.5 && v < 0.6) return "LT3";
  if (v >= 0.6 && v < 0.7) return "HT3";
  if (v >= 0.7 && v < 0.8) return "LT2";
  if (v >= 0.8 && v < 0.9) return "HT2";
  if (v >= 0.9 && v < 1.0) return "LT1";
  if (v >= 1.0) return "HT1";
  return "Invalid";
}

function calc() {

  let tierName = document.getElementById("tier").value;
  let t = tierMap[tierName];

  let input = document.getElementById("hp").value;

  let nums = input
    .split(",")
    .map(x => parseFloat(x.trim()))
    .filter(x => !isNaN(x));

  if (nums.length === 0) {
    document.getElementById("result").innerHTML = "❌ Invalid input";
    return;
  }

  // SUM EXACT (positive = win, negative = loss)
  let sum = nums.reduce((a,b)=>a+b,0);

  // AVERAGE
  let avg = sum / nums.length;

  // FINAL VALUE (REAL FORMULA)
  let value = (avg / 100) * (t - 1) + t;

  // CORRECT TIER
  let finalTier = getTierFromValue(value);

  document.getElementById("result").innerHTML = `
    Average HP: ${avg.toFixed(2)} <br>
    Value: ${value.toFixed(3)} <br><br>
    <span class="tier">${finalTier}</span>
  `;
}

</script>

</body>
</html>
