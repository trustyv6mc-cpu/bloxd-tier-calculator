<!DOCTYPE html>
<html>
<head>
  <title>Bloxd Tier Calculator</title>
  <style>
    body {
      background: #0f0f0f;
      color: white;
      font-family: Arial;
      text-align: center;
      padding: 20px;
    }

    textarea, input {
      width: 300px;
      padding: 10px;
      margin: 10px;
      border-radius: 5px;
      border: none;
    }

    button {
      padding: 10px 20px;
      background: #00ff88;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #00cc6a;
    }

    .box {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<h1>⚔️ Bloxd Tier Calculator</h1>

<p>Enter matches (W = win, L = loss)</p>

<textarea id="input" rows="10" placeholder="W 25
W 67
W 78
W 32
L 10
W 12"></textarea>

<br>

<input id="t" placeholder="Enter tier value (example 0.7)">

<br>

<button onclick="calc()">Calculate</button>

<div class="box" id="result"></div>

<script>
function calc() {
    let lines = document.getElementById("input").value.trim().split("\n");
    let t = parseFloat(document.getElementById("t").value);

    let sum = 0;
    let count = 0;

    for (let line of lines) {
        let parts = line.trim().split(" ");
        let type = parts[0];
        let value = parseFloat(parts[1]);

        if (!isNaN(value)) {
            if (type === "W") sum += value;
            else if (type === "L") sum -= value;
            count++;
        }
    }

    let avg = sum / count;

    let score = (avg / 100) * (t - 1) + t;

    let tier = "";

    // ✅ FIXED NON-OVERLAPPING SYSTEM
    if (score < 0.2) tier = "LT5";
    else if (score < 0.3) tier = "HT5";
    else if (score < 0.4) tier = "LT4";
    else if (score < 0.5) tier = "HT4";
    else if (score < 0.6) tier = "LT3";
    else if (score < 0.7) tier = "HT3";
    else if (score < 0.8) tier = "LT2";
    else if (score < 0.9) tier = "HT2";
    else if (score < 1.0) tier = "LT1";
    else tier = "HT1";

    document.getElementById("result").innerHTML =
        "📊 Average: " + avg.toFixed(2) +
        "<br>⚡ Score: " + score.toFixed(3) +
        "<br>🏆 Tier: " + tier;
}
</script>

</body>
</html>
