<!DOCTYPE html>
<html>
<head>
  <title>Bloxd Tier Calculator</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: radial-gradient(circle at top, #0f0f0f, #000);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .panel {
      width: 480px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,255,150,0.2);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 0 30px rgba(0,255,150,0.15);
      animation: pop 0.5s ease;
    }

    @keyframes pop {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    h1 {
      text-align: center;
      color: #00ff88;
      margin-bottom: 15px;
    }

    .editor {
      background: #0f0f0f;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #333;
      min-height: 180px;
      outline: none;
      white-space: pre-line;
      font-size: 14px;
    }

    .editor:focus {
      border-color: #00ff88;
      box-shadow: 0 0 10px #00ff88;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg,#00ff88,#00c3ff);
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: rgba(0,0,0,0.4);
      animation: fade 0.5s ease;
      line-height: 1.8;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tier {
      font-size: 22px;
      font-weight: bold;
    }

    .LT5 { color:#ff4d4d; }
    .HT5 { color:#ff884d; }
    .LT4 { color:#ffd24d; }
    .HT4 { color:#c6ff4d; }
    .LT3 { color:#4dff88; }
    .HT3 { color:#00ff88; }
    .LT2 { color:#00e6ff; }
    .HT2 { color:#4d79ff; }
    .LT1 { color:#b84dff; }
    .HT1 { color:#ff4df0; }

    .good {
      color: #00ff88;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="panel">

<h1>⚔️ Bloxd Tier Calculator</h1>

<div class="editor" contenteditable="true" id="input">
Tier Tester Tier: LT2
W 67
W 67
W 67
W 67
W 67
</div>

<button onclick="calc()">RUN ANALYSIS</button>

<div class="result" id="result"></div>

</div>

<!-- Sounds -->
<audio id="click" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
<audio id="win" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

<script>
function calc() {

    document.getElementById("click").play();

    let text = document.getElementById("input").innerText.trim().split("\n");

    let testerTier = text[0].split(":")[1].trim().toUpperCase();

    let win = 0;
    let loss = 0;
    let sum = 0;
    let count = 0;

    for (let i = 1; i < text.length; i++) {

        let parts = text[i].trim().split(" ");
        let type = parts[0];
        let value = parseFloat(parts[1]);

        if (isNaN(value)) continue;

        if (type === "W") {
            win++;
            sum += value;
        } else if (type === "L") {
            loss++;
            sum -= value;
        }

        count++;
    }

    let scoreText = win + "-" + loss;
    let avg = sum / count;
    let value = avg / 100;

    let tier = "";
    let range = "";
    let color = "";

    if (value < 0.2) { tier="LT5"; range="0.1 - 0.19999"; color="LT5"; }
    else if (value < 0.3) { tier="HT5"; range="0.2 - 0.29999"; color="HT5"; }
    else if (value < 0.4) { tier="LT4"; range="0.3 - 0.39999"; color="LT4"; }
    else if (value < 0.5) { tier="HT4"; range="0.4 - 0.49999"; color="HT4"; }
    else if (value < 0.6) { tier="LT3"; range="0.5 - 0.59999"; color="LT3"; }
    else if (value < 0.7) { tier="HT3"; range="0.6 - 0.69999"; color="HT3"; }
    else if (value < 0.8) { tier="LT2"; range="0.7 - 0.79999"; color="LT2"; }
    else if (value < 0.9) { tier="HT2"; range="0.8 - 0.89999"; color="HT2"; }
    else if (value < 1.0) { tier="LT1"; range="0.9 - 0.99999"; color="LT1"; }
    else { tier="HT1"; range="1.0+"; color="HT1"; }

    document.getElementById("win").play();

    document.getElementById("result").innerHTML = `
        📊 Score: <b>${scoreText}</b><br>
        ⚡ Value: <b>${value.toFixed(3)}</b><br>
        🏆 Player Tier: <b class="${color}">${tier}</b><br>
        👤 Tester Tier: <b>${testerTier}</b><br>
        📌 Range: ${range}<br>
        <div class="good">🎉 CONGRATULATIONS</div>
    `;
}
</script>

</body>
</html>
