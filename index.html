<!DOCTYPE html>
<html>
<head>
  <title>Tier Tester Esports Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: radial-gradient(circle at top, #111, #000);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .card {
      width: 450px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(0,255,150,0.2);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 0 40px rgba(0,255,150,0.15);
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    h1 {
      text-align: center;
      color: #00ff88;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      height: 180px;
      background: #0f0f0f;
      color: white;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg,#00ff88,#00c3ff);
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      background: rgba(0,0,0,0.4);
      animation: pop 0.5s ease;
    }

    @keyframes pop {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .score {
      font-size: 20px;
      font-weight: bold;
      color: #00ff88;
    }

    .tier {
      font-size: 22px;
      font-weight: bold;
      margin-top: 5px;
    }

    .LT5 { color:#ff4d4d; }
    .HT5 { color:#ff884d; }
    .LT4 { color:#ffd24d; }
    .HT4 { color:#c6ff4d; }
    .LT3 { color:#4dff88; }
    .HT3 { color:#00ff88; }
    .LT2 { color:#00e6ff; }
    .HT2 { color:#4d79ff; }
    .LT1 { color:#b84dff; }
    .HT1 { color:#ff4df0; }

    .good {
      color: #00ff88;
      font-weight: bold;
      margin-top: 10px;
    }

  </style>
</head>

<body>

<div class="card">

<h1>⚔️ Tier Tester Pro Esports</h1>

<textarea id="input">Tier Tester Tier: LT2
W 67
L 78
W 21
L 81
W 12
W 14</textarea>

<button onclick="calc()">RUN ANALYSIS</button>

<div id="result"></div>

</div>

<!-- SOUND EFFECTS -->
<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
<audio id="winSound" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

<script>
function playClick() {
  document.getElementById("clickSound").play();
}

function playWin() {
  document.getElementById("winSound").play();
}

function calc() {

    playClick();

    let lines = document.getElementById("input").value.trim().split("\n");

    let testerTier = lines[0].split(":")[1].trim().toUpperCase();

    let win = 0;
    let loss = 0;
    let sum = 0;
    let count = 0;

    for (let i = 1; i < lines.length; i++) {
        let parts = lines[i].split(" ");
        let type = parts[0];
        let value = parseFloat(parts[1]);

        if (isNaN(value)) continue;

        if (type === "W") {
            win++;
            sum += value;
        } else if (type === "L") {
            loss++;
            sum -= value;
        }

        count++;
    }

    let scoreText = win + "-" + loss;
    let avg = sum / count;
    let value = avg / 100;

    let tier = "";
    let color = "";

    if (value < 0.2) { tier="LT5"; color="LT5"; }
    else if (value < 0.3) { tier="HT5"; color="HT5"; }
    else if (value < 0.4) { tier="LT4"; color="LT4"; }
    else if (value < 0.5) { tier="HT4"; color="HT4"; }
    else if (value < 0.6) { tier="LT3"; color="LT3"; }
    else if (value < 0.7) { tier="HT3"; color="HT3"; }
    else if (value < 0.8) { tier="LT2"; color="LT2"; }
    else if (value < 0.9) { tier="HT2"; color="HT2"; }
    else if (value < 1.0) { tier="LT1"; color="LT1"; }
    else { tier="HT1"; color="HT1"; }

    playWin();

    document.getElementById("result").innerHTML =
    `
    <div class="result">
      <div class="score">📊 Score: ${scoreText}</div>
      <div>⚡ Value: ${value.toFixed(3)}</div>

      <div class="tier ${color}">🏆 Player Tier: ${tier}</div>

      <div>👤 Tester Tier: ${testerTier}</div>

      <div class="good">🎉 CONGRATULATIONS!</div>
    </div>
    `;
}
</script>

</body>
</html>
